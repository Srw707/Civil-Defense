function vsClass(v,sc){let s=0,w="";const f=(l,t)=>{if(l>s){s=l;w=t}};

if(v.sp<88)f(3,"نقص أكسجة ("+v.sp+"%)");else if(v.sp<92)f(2,"انخفاض الأكسجة ("+v.sp+"%)");

if(v.amb>=200)f(2,"حرارة المحيط "+v.amb+"°م");
if(s===0&&(v.hr>140||v.tp>=38||v.amb>=100))f(1,"إجهاد بدني");return[s,w||"المؤشرات طبيعية"]}
function vsTick(){const act=S.inc&&S.inc.stage>=2&&S.inc.stage<4?S.inc:null;S.codes.filter(c=>c.role==="member"&&(c.online||S.vsc[c.name])).forEach(c=>{const v=S.vs[c.name]||(S.vs[c.name]={hr:75,tp:36.8,sp:98,co:5,amb:30,imm:0,bat:90,st:0,reason:"",hist:[],lvl:0}),sc=S.vsc[c.name],on=act&&act.by===c.name,fire=on&&/حريق/.test(act.type);
let thr=72,tp=36.8,sp=98,co=5,amb=30,im=0;if(on){thr=105;tp=37.4;amb=fire?90:35;co=fire?45:8}
if(sc){const e=Math.min(1,(now()-sc.t0)/20000);if(sc.k==="fire"){thr=110+e*75;tp=37+e*2.2;co=40+e*220;amb=80+e*170;sp=98-e*6}if(sc.k==="collapse"){thr=70-e*28;sp=97-e*11;im=e*40;co=10}if(sc.k==="heat"){thr=120+e*50;tp=37.5+e*2.3;amb=60+e*20}if(sc.k==="sos"){thr=150}}
const j=(x,r)=>x+(Math.random()-.5)*r;v.hr=Math.round(j(thr,6));v.tp=+j(tp,.15).toFixed(1);v.sp=Math.round(Math.min(100,j(sp,1.2)));v.co=Math.round(Math.max(0,j(co,6)));v.amb=Math.round(j(amb,4));v.imm=Math.round(im);v.bat=Math.max(5,v.bat-.02);v.hist.push(v.hr);if(v.hist.length>24)v.hist.shift();
const r=vsClass(v,sc);v.reason=r[1];if(r[0]>=2&&r[0]>v.lvl){S.alerts.unshift({txt:"🩺 "+c.name+" — "+VL[r[0]]+": "+r[1],ts:now(),vs:c.name});vsFresh=true}v.lvl=r[0]<2?0:Math.max(v.lvl,r[0]);v.st=r[0]})}
